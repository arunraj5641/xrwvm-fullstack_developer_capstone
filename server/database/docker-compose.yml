services:
  mongo_db:
    image: mongo:6
    container_name: db_container
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    image: nodeapp
    container_name: dealership_api
    ports:
      - "3030:3030"
    depends_on:
      - mongo_db
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
    restart: unless-stopped

volumes:
  mongo_data:
